<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Studio Video Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Dodum&family=Sunflower:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0F1117',
                            800: '#181B24',
                            700: '#232734',
                            600: '#2E3446',
                            500: '#3F475E'
                        },
                        brand: {
                            500: '#6366F1',
                            600: '#4F46E5',
                            700: '#4338CA'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                        gowun: ['Gowun Dodum', 'sans-serif'],
                        sunflower: ['Sunflower', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #181B24; }
        ::-webkit-scrollbar-thumb { background: #3F475E; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366F1; }
        .canvas-container { box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7); }
        .ruler-ticks { background-image: repeating-linear-gradient(90deg, #3F475E 0, #3F475E 1px, transparent 0, transparent 10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-dark-900 text-gray-200 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- Top Navigation Header -->
    <header class="h-14 bg-dark-800 border-b border-dark-700 flex items-center justify-between px-3 md:px-4 shrink-0 z-20 gap-2">
        <div class="flex items-center space-x-2 md:space-x-3 shrink-0">
            <div class="bg-brand-600 p-2 rounded-lg text-white font-bold text-lg flex items-center justify-center w-8 h-8 md:w-9 md:h-9">
                <i class="fa-solid font-black fa-film text-sm md:text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-sm md:text-base tracking-wide flex items-center gap-1.5 whitespace-nowrap">
                    Web Studio <span class="hidden sm:inline-block text-[10px] bg-brand-500/20 text-brand-500 border border-brand-500/30 px-2 py-0.5 rounded-full font-normal">Web Edition</span>
                </h1>
            </div>
        </div>

        <!-- Undo / Redo -->
        <div class="flex items-center space-x-1.5 md:space-x-2">
            <button id="undoBtn" class="bg-dark-700 hover:bg-dark-600 disabled:opacity-40 text-gray-300 text-xs px-2.5 py-1.5 rounded-lg border border-dark-600 transition flex items-center gap-1" title="실행 취소 (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left"></i> <span class="hidden md:inline">실행 취소</span>
            </button>
            <button id="redoBtn" class="bg-dark-700 hover:bg-dark-600 disabled:opacity-40 text-gray-300 text-xs px-2.5 py-1.5 rounded-lg border border-dark-600 transition flex items-center gap-1" title="다시 실행 (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right"></i> <span class="hidden md:inline">다시 실행</span>
            </button>
        </div>

        <!-- Project Controls & Actions -->
        <div class="flex items-center space-x-2 md:space-x-3 overflow-x-auto no-scrollbar">
            <div class="flex items-center bg-dark-700 rounded-lg p-1 border border-dark-600 shrink-0">
                <span class="text-[11px] text-gray-400 px-1.5 font-medium whitespace-nowrap">비율</span>
                <select id="aspectRatioSelect" class="bg-dark-800 text-[11px] md:text-xs text-white px-1.5 py-1 rounded border border-dark-600 focus:outline-none focus:border-brand-500">
                    <option value="16:9">16:9 (유튜브)</option>
                    <option value="9:16">9:16 (쇼츠/릴스)</option>
                    <option value="1:1">1:1 (인스타그램)</option>
                    <option value="4:3">4:3 (클래식)</option>
                </select>
            </div>

            <button id="openExportModalBtn" class="bg-brand-600 hover:bg-brand-500 text-white text-[11px] md:text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-lg shadow-brand-600/20 transition shrink-0 whitespace-nowrap">
                <i class="fa-solid fa-file-video"></i> 내보내기
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left Tools Sidebar -->
        <aside class="w-full md:w-80 lg:w-96 bg-dark-800 border-r border-dark-700 flex flex-col shrink-0 z-10 max-h-64 md:max-h-none overflow-hidden">
            <div class="flex border-b border-dark-700 bg-dark-900/50 overflow-x-auto no-scrollbar shrink-0">
                <button data-tab="subtitles" class="tab-btn flex-1 min-w-[75px] px-2 py-2.5 text-[11px] sm:text-xs font-semibold border-b-2 border-brand-500 text-brand-500 flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-closed-captioning text-xs sm:text-sm"></i> 자막/텍스트
                </button>
                <button data-tab="filters" class="tab-btn flex-1 min-w-[75px] px-2 py-2.5 text-[11px] sm:text-xs font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center justify-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-sliders text-xs sm:text-sm"></i> 필터/변환
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-4">
                <!-- Subtitles Tab -->
                <div id="tab-subtitles" class="tab-content space-y-4">
                    <div class="bg-dark-700/50 p-3 rounded-xl border border-dark-600/50 space-y-3">
                        <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider flex items-center justify-between">
                            <span>자막 추가 / 편집</span>
                        </h3>
                        <textarea id="subTextInput" rows="2" placeholder="자막 내용을 입력하세요..." class="w-full bg-dark-900 text-sm text-white p-2.5 rounded-lg border border-dark-600 focus:outline-none focus:border-brand-500 resize-none"></textarea>
                        
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label class="text-gray-400 block mb-1">시작 시간 (초)</label>
                                <input type="number" id="subStartInput" value="0" step="0.1" min="0" class="w-full bg-dark-900 text-white p-1.5 rounded border border-dark-600 text-center">
                            </div>
                            <div>
                                <label class="text-gray-400 block mb-1">종료 시간 (초)</label>
                                <input type="number" id="subEndInput" value="5" step="0.1" min="0" class="w-full bg-dark-900 text-white p-1.5 rounded border border-dark-600 text-center">
                            </div>
                        </div>

                        <button id="addSubtitleBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> 자막 등록
                        </button>
                    </div>

                    <div class="space-y-2">
                        <div class="flex items-center justify-between text-xs font-semibold text-gray-400 px-1">
                            <span>등록된 자막 목록</span>
                            <span id="subCountBadge" class="bg-dark-700 px-2 py-0.5 rounded-full text-[10px]">0개</span>
                        </div>
                        <div id="subtitlesList" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                            <p class="text-xs text-gray-500 text-center py-4">등록된 자막이 없습니다.</p>
                        </div>
                    </div>
                </div>

                <!-- Filters Tab -->
                <div id="tab-filters" class="tab-content hidden space-y-4">
                    <div class="bg-dark-700/50 p-3 rounded-xl border border-dark-600/50 space-y-3">
                        <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider">비디오 색상 / 필터</h3>
                        <div class="space-y-2 text-xs">
                            <div>
                                <div class="flex justify-between text-gray-400 mb-1">
                                    <span>밝기 (Brightness)</span>
                                    <span id="valBrightness">100%</span>
                                </div>
                                <input type="range" id="filterBrightness" min="0" max="200" value="100" class="w-full accent-brand-500 h-1.5 bg-dark-900 rounded-lg cursor-pointer">
                            </div>
                            <div>
                                <div class="flex justify-between text-gray-400 mb-1">
                                    <span>명암 (Contrast)</span>
                                    <span id="valContrast">100%</span>
                                </div>
                                <input type="range" id="filterContrast" min="0" max="200" value="100" class="w-full accent-brand-500 h-1.5 bg-dark-900 rounded-lg cursor-pointer">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center Player & Preview -->
        <main class="flex-1 flex flex-col bg-dark-900 relative overflow-hidden">
            <div id="dropZone" class="flex-1 flex items-center justify-center p-3 sm:p-6 relative overflow-hidden min-h-[250px]">
                <div id="emptyState" class="flex flex-col items-center justify-center text-center p-6 sm:p-8 border-2 border-dashed border-dark-700 rounded-2xl bg-dark-800/30 max-w-md">
                    <div class="w-12 h-12 sm:w-16 sm:h-16 bg-dark-700 rounded-full flex items-center justify-center text-brand-500 text-xl sm:text-2xl mb-3 sm:mb-4">
                        <i class="fa-solid fa-file-video"></i>
                    </div>
                    <h2 class="text-base sm:text-lg font-bold text-white mb-1">편집할 동영상을 불러오세요</h2>
                    <label class="bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl cursor-pointer transition mt-2 shadow-lg shadow-brand-600/20">
                        비디오 파일 선택
                        <input type="file" id="videoFileInput" accept="video/*" class="hidden">
                    </label>
                </div>

                <div id="canvasWrapper" class="relative hidden canvas-container rounded-lg overflow-hidden border border-dark-700 max-w-full max-h-full flex items-center justify-center">
                    <canvas id="mainCanvas" class="block bg-black cursor-crosshair max-w-full max-h-full"></canvas>
                </div>
            </div>

            <!-- Controls Bar -->
            <div id="playerControlBar" class="h-12 bg-dark-800 border-t border-dark-700 px-3 sm:px-6 flex items-center justify-between shrink-0 hidden gap-2 overflow-x-auto no-scrollbar">
                <div class="flex items-center space-x-3 shrink-0">
                    <button id="playPauseBtn" class="text-brand-500 hover:text-brand-400 text-base sm:text-lg transition">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <span id="timeDisplay" class="text-xs font-mono text-gray-300 whitespace-nowrap">00:00 / 00:00</span>
                </div>

                <div class="flex items-center space-x-2 shrink-0">
                    <button id="splitVideoBtn" class="bg-dark-700 hover:bg-dark-600 text-xs text-white px-2.5 py-1.5 rounded-lg border border-dark-600 flex items-center gap-1.5 transition whitespace-nowrap">
                        <i class="fa-solid fa-scissors text-brand-500"></i> 현재 위치 컷 분할
                    </button>
                    <button id="deleteClipBtn" disabled class="bg-red-500/20 hover:bg-red-500/30 text-red-400 disabled:opacity-40 text-xs px-2.5 py-1.5 rounded-lg border border-red-500/30 flex items-center gap-1.5 transition whitespace-nowrap">
                        <i class="fa-solid fa-trash-can"></i> 선택 클립 삭제
                    </button>
                </div>
            </div>

            <!-- Timeline -->
            <div id="timelineContainer" class="h-40 sm:h-48 bg-dark-800 border-t border-dark-700 flex flex-col shrink-0 hidden relative">
                <div class="h-8 bg-dark-900/60 border-b border-dark-700 px-3 sm:px-4 flex items-center justify-between text-xs text-gray-400">
                    <span class="font-semibold text-gray-300 text-xs">타임라인</span>
                    <span class="text-[10px] sm:text-[11px] text-gray-500">클립 클릭: 선택 | Del: 선택 클립 삭제</span>
                </div>

                <div class="flex-1 overflow-x-auto overflow-y-hidden relative p-2" id="timelineScrollArea">
                    <div id="timelineRuler" class="h-5 border-b border-dark-700 relative mb-2 ruler-ticks cursor-pointer">
                        <div id="playhead" class="absolute top-0 bottom-0 w-0.5 bg-red-500 z-30 pointer-events-none" style="left: 0%;">
                            <div class="w-3 h-3 bg-red-500 rotate-45 -ml-1.25 -mt-1 rounded-sm"></div>
                        </div>
                    </div>

                    <div class="space-y-1.5 text-xs font-medium">
                        <div class="h-10 bg-dark-700/60 rounded-md relative border border-dark-600/50 overflow-hidden" id="videoTrackRow">
                            <div id="videoClipsContainer" class="absolute inset-0"></div>
                        </div>
                        <div class="h-7 bg-dark-700/40 rounded-md relative flex items-center border border-dark-600/30">
                            <span class="absolute left-2 z-10 text-[10px] bg-dark-900/80 px-1.5 py-0.5 rounded text-amber-400">자막</span>
                            <div id="subtitleClipsContainer" class="absolute inset-0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-dark-800 border border-dark-700 rounded-2xl w-full max-w-md p-5 sm:p-6 space-y-5 shadow-2xl">
            <div class="flex items-center justify-between border-b border-dark-700 pb-3">
                <h3 class="font-bold text-white text-base flex items-center gap-2">
                    <i class="fa-solid fa-file-export text-brand-500"></i> 동영상 내보내기 설정
                </h3>
                <button id="closeExportModalBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="text-gray-300 block mb-1 font-semibold">내보내기 포맷</label>
                    <select id="exportFormat" class="w-full bg-dark-900 text-white p-2.5 rounded-lg border border-dark-600 focus:outline-none focus:border-brand-500">
                        <!-- MP4 기본 선택 -->
                        <option value="mp4" selected>MP4 (기본 권장 / 브라우저 호환)</option>
                        <option value="webm">WebM (고화질)</option>
                    </select>
                </div>

                <div id="exportProgressWrapper" class="space-y-1.5 hidden pt-2">
                    <div class="flex justify-between text-[11px] text-gray-400">
                        <span id="exportStatusText">인코딩 및 녹화 준비 중...</span>
                        <span id="exportPercent">0%</span>
                    </div>
                    <div class="w-full bg-dark-900 h-2 rounded-full overflow-hidden">
                        <div id="exportProgressBar" class="bg-brand-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button id="cancelExportBtn" class="bg-dark-700 hover:bg-dark-600 text-gray-300 text-xs px-4 py-2 rounded-lg transition">취소</button>
                <button id="startExportBtn" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-5 py-2 rounded-lg flex items-center gap-2 shadow-lg shadow-brand-600/20 transition">
                    <i class="fa-solid fa-download"></i> 인코딩 및 내보내기 시작
                </button>
            </div>
        </div>
    </div>

    <video id="hiddenVideo" class="hidden" playsinline></video>

    <script>
        // State Management & Multi-Clip Data
        const state = {
            videoFile: null,
            videoDuration: 0,
            isPlaying: false,
            aspectRatio: '16:9',
            canvasWidth: 1280,
            canvasHeight: 720,
            
            // 다중 클립 분할 관리 배열
            clips: [], // { id, start, end }
            selectedClipId: null,

            filters: { brightness: 100, contrast: 100 },
            subtitles: [],
            selectedSubId: null,
            isExporting: false
        };

        const historyStack = [];
        let historyIndex = -1;

        function pushState() {
            if (historyIndex < historyStack.length - 1) historyStack.splice(historyIndex + 1);
            const snap = {
                aspectRatio: state.aspectRatio,
                clips: JSON.parse(JSON.stringify(state.clips)),
                filters: { ...state.filters },
                subtitles: JSON.parse(JSON.stringify(state.subtitles))
            };
            historyStack.push(snap);
            historyIndex = historyStack.length - 1;
            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= historyStack.length - 1;
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                applyStateSnapshot(historyStack[historyIndex]);
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++;
                applyStateSnapshot(historyStack[historyIndex]);
            }
        }

        function applyStateSnapshot(snap) {
            state.aspectRatio = snap.aspectRatio;
            state.clips = JSON.parse(JSON.stringify(snap.clips));
            state.filters = { ...snap.filters };
            state.subtitles = JSON.parse(JSON.stringify(snap.subtitles));
            state.selectedClipId = null;

            updateCanvasDimensions();
            renderSubtitlesList();
            updateTimelineClips();
            renderCanvasFrame();
            updateUndoRedoUI();
        }

        // DOM Elements
        const videoInput = document.getElementById('videoFileInput');
        const videoEl = document.getElementById('hiddenVideo');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const emptyState = document.getElementById('emptyState');
        const playerControlBar = document.getElementById('playerControlBar');
        const timelineContainer = document.getElementById('timelineContainer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const timeDisplay = document.getElementById('timeDisplay');
        const playhead = document.getElementById('playhead');
        const timelineRuler = document.getElementById('timelineRuler');
        const deleteClipBtn = document.getElementById('deleteClipBtn');

        window.addEventListener('resize', () => { if (state.videoFile) updateCanvasDimensions(); });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('border-brand-500', 'text-brand-500');
                    b.classList.add('border-transparent', 'text-gray-400');
                });
                btn.classList.add('border-brand-500', 'text-brand-500');
                btn.classList.remove('border-transparent', 'text-gray-400');

                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
            });
        });

        // File Loader
        videoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) loadVideoFile(e.target.files[0]);
        });

        function loadVideoFile(file) {
            state.videoFile = file;
            videoEl.src = URL.createObjectURL(file);
            videoEl.load();

            videoEl.onloadedmetadata = () => {
                state.videoDuration = videoEl.duration;
                // 초기 전체 영역을 단일 클립으로 등록
                state.clips = [{ id: Date.now(), start: 0, end: videoEl.duration }];
                state.selectedClipId = null;

                updateCanvasDimensions();
                emptyState.classList.add('hidden');
                canvasWrapper.classList.remove('hidden');
                playerControlBar.classList.remove('hidden');
                timelineContainer.classList.remove('hidden');

                pushState();
                updateTimelineClips();
                renderCanvasFrame();
            };
        }

        function updateCanvasDimensions() {
            let baseW = 1280, baseH = 720;
            if (state.aspectRatio === '9:16') { baseW = 720; baseH = 1280; }
            else if (state.aspectRatio === '1:1') { baseW = 1080; baseH = 1080; }
            else if (state.aspectRatio === '4:3') { baseW = 960; baseH = 720; }

            state.canvasWidth = baseW;
            state.canvasHeight = baseH;
            canvas.width = baseW;
            canvas.height = baseH;

            const dropContainer = document.getElementById('dropZone');
            const maxW = dropContainer.clientWidth - 32;
            const maxH = dropContainer.clientHeight - 32;
            const scale = Math.min(maxW / baseW, maxH / baseH, 1.0);

            canvas.style.width = `${Math.max(200, baseW * scale)}px`;
            canvas.style.height = `${Math.max(150, baseH * scale)}px`;
        }

        // Render Frame & Play Loop
        function renderCanvasFrame() {
            if (state.clips.length === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // 현재 재생 위치가 삭제된 구간(빈 공간)인지 체크하고 다음 클립으로 점프
            let currentClip = state.clips.find(c => videoEl.currentTime >= c.start && videoEl.currentTime < c.end);
            if (!currentClip && state.isPlaying) {
                let nextClip = state.clips.find(c => c.start > videoEl.currentTime);
                if (nextClip) {
                    videoEl.currentTime = nextClip.start;
                } else {
                    // 영상의 끝에 다다르면 재생 정지 또는 처음 클립으로 이동
                    videoEl.currentTime = state.clips[0].start;
                    togglePlay();
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (videoEl.readyState >= 2) {
                ctx.save();
                ctx.filter = `brightness(${state.filters.brightness}%) contrast(${state.filters.contrast}%)`;

                const vRatio = videoEl.videoWidth / videoEl.videoHeight;
                let drawW = canvas.width, drawH = canvas.width / vRatio;
                if (drawH < canvas.height) { drawH = canvas.height; drawW = canvas.height * vRatio; }
                ctx.drawImage(videoEl, (canvas.width - drawW) / 2, (canvas.height - drawH) / 2, drawW, drawH);
                ctx.restore();
            }

            // Draw Subtitles
            const currentTime = videoEl.currentTime;
            state.subtitles.forEach(sub => {
                if (currentTime >= sub.start && currentTime <= sub.end) {
                    ctx.save();
                    ctx.font = `32px "Noto Sans KR"`;
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 4;
                    ctx.strokeText(sub.text, sub.x, sub.y);
                    ctx.fillText(sub.text, sub.x, sub.y);
                    ctx.restore();
                }
            });

            // Update Timeline UI
            if (state.videoDuration > 0) {
                const progress = (videoEl.currentTime / state.videoDuration) * 100;
                playhead.style.left = `${progress}%`;
                timeDisplay.textContent = `${formatTime(videoEl.currentTime)} / ${formatTime(state.videoDuration)}`;
            }

            if (state.isPlaying && !state.isExporting) {
                requestAnimationFrame(renderCanvasFrame);
            }
        }

        // Playback Logic
        playPauseBtn.addEventListener('click', togglePlay);
        function togglePlay() {
            if (state.clips.length === 0) return;

            if (videoEl.paused) {
                videoEl.play();
                state.isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                requestAnimationFrame(renderCanvasFrame);
            } else {
                videoEl.pause();
                state.isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        // --- Multi-Clip Split & Delete Implementation ---
        
        // 컷 분할 (Split)
        document.getElementById('splitVideoBtn').addEventListener('click', splitCurrentClip);
        function splitCurrentClip() {
            const currentTime = videoEl.currentTime;
            const targetIndex = state.clips.findIndex(c => currentTime > c.start && currentTime < c.end);

            if (targetIndex !== -1) {
                const target = state.clips[targetIndex];
                const clip1 = { id: Date.now(), start: target.start, end: currentTime };
                const clip2 = { id: Date.now() + 1, start: currentTime, end: target.end };

                state.clips.splice(targetIndex, 1, clip1, clip2);
                state.selectedClipId = clip2.id; // 분할 후 뒤쪽 클립 선택

                pushState();
                updateTimelineClips();
                renderCanvasFrame();
            }
        }

        // 클립 삭제 (Delete)
        deleteClipBtn.addEventListener('click', deleteSelectedClip);
        function deleteSelectedClip() {
            if (!state.selectedClipId) return;

            state.clips = state.clips.filter(c => c.id !== state.selectedClipId);
            state.selectedClipId = null;

            pushState();
            updateTimelineClips();
            renderCanvasFrame();
        }

        // Timeline Clips Render & Select
        function updateTimelineClips() {
            const container = document.getElementById('videoClipsContainer');
            deleteClipBtn.disabled = !state.selectedClipId;

            container.innerHTML = state.clips.map(clip => {
                const left = (clip.start / state.videoDuration) * 100;
                const width = ((clip.end - clip.start) / state.videoDuration) * 100;
                const isSelected = clip.id === state.selectedClipId;

                return `
                    <div onclick="selectClip(event, ${clip.id})" 
                         class="absolute top-1 bottom-1 rounded border cursor-pointer flex items-center justify-between px-2 text-[10px] text-white transition ${isSelected ? 'bg-brand-600 border-white ring-2 ring-brand-500 z-10' : 'bg-brand-600/50 border-brand-400/50 hover:bg-brand-600/80'}" 
                         style="left: ${left}%; width: ${width}%;">
                        <span class="truncate"><i class="fa-solid fa-film"></i> ${clip.start.toFixed(1)}s~${clip.end.toFixed(1)}s</span>
                    </div>
                `;
            }).join('');
        }

        window.selectClip = function(e, id) {
            e.stopPropagation();
            state.selectedClipId = id;
            updateTimelineClips();
        };

        timelineRuler.addEventListener('click', (e) => {
            const rect = timelineRuler.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const pct = clickX / rect.width;
            videoEl.currentTime = pct * state.videoDuration;
            renderCanvasFrame();
        });

        // Subtitles
        document.getElementById('addSubtitleBtn').addEventListener('click', () => {
            const text = document.getElementById('subTextInput').value.trim();
            if (!text) return;

            state.subtitles.push({
                id: Date.now(),
                text: text,
                start: parseFloat(document.getElementById('subStartInput').value) || 0,
                end: parseFloat(document.getElementById('subEndInput').value) || 5,
                x: state.canvasWidth / 2,
                y: state.canvasHeight - 80
            });

            document.getElementById('subTextInput').value = '';
            pushState();
            renderSubtitlesList();
            renderCanvasFrame();
        });

        function renderSubtitlesList() {
            const listEl = document.getElementById('subtitlesList');
            document.getElementById('subCountBadge').textContent = `${state.subtitles.length}개`;
            if (state.subtitles.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">등록된 자막이 없습니다.</p>`;
                return;
            }
            listEl.innerHTML = state.subtitles.map(sub => `
                <div class="bg-dark-900/80 p-2 rounded-lg border border-dark-600 flex items-center justify-between text-xs">
                    <p class="text-white truncate">${sub.text} (${sub.start}s~${sub.end}s)</p>
                </div>
            `).join('');
        }

        // Undo/Redo & Key Shortcuts
        document.getElementById('undoBtn').addEventListener('click', undo);
        document.getElementById('redoBtn').addEventListener('click', redo);

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            else if (e.code === 'Delete' || e.code === 'Backspace') { 
                if (state.selectedClipId) { e.preventDefault(); deleteSelectedClip(); }
            }
            else if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault(); undo(); }
            else if (e.ctrlKey && e.code === 'KeyY') { e.preventDefault(); redo(); }
        });

        // Export System (MP4 Primary Default)
        const exportModal = document.getElementById('exportModal');
        document.getElementById('openExportModalBtn').addEventListener('click', () => exportModal.classList.remove('hidden'));
        document.getElementById('closeExportModalBtn').addEventListener('click', () => exportModal.classList.add('hidden'));
        document.getElementById('cancelExportBtn').addEventListener('click', () => exportModal.classList.add('hidden'));

        document.getElementById('startExportBtn').addEventListener('click', startExportingVideo);

        async function startExportingVideo() {
            if (state.clips.length === 0) return;

            state.isExporting = true;
            if (state.isPlaying) togglePlay();

            const format = document.getElementById('exportFormat').value; // 'mp4' or 'webm'
            const mimeType = format === 'mp4' ? 'video/mp4' : 'video/webm;codecs=vp9';

            const progressWrapper = document.getElementById('exportProgressWrapper');
            const progressBar = document.getElementById('exportProgressBar');
            const percentText = document.getElementById('exportPercent');
            const statusText = document.getElementById('exportStatusText');

            progressWrapper.classList.remove('hidden');
            statusText.textContent = 'MP4 인코딩 및 내보내기 준비 중...';

            const stream = canvas.captureStream(30);
            const recordedChunks = [];
            
            let mediaRecorder;
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
            } catch (err) {
                // 특정 브라우저에서 mp4 mimeType 미지원 시 webm으로 자동 폴백
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: format === 'mp4' ? 'video/mp4' : 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `StudioPro_Export_${Date.now()}.${format}`;
                a.click();

                state.isExporting = false;
                statusText.textContent = '내보내기 완료!';
                setTimeout(() => exportModal.classList.add('hidden'), 1000);
            };

            // 선택된 클립들의 순서대로 순차 녹화 진행
            let currentClipIdx = 0;
            videoEl.currentTime = state.clips[0].start;
            mediaRecorder.start();

            const totalDuration = state.clips.reduce((acc, c) => acc + (c.end - c.start), 0);
            let processedTime = 0;

            const exportInterval = setInterval(() => {
                let activeClip = state.clips[currentClipIdx];

                if (!activeClip || videoEl.currentTime >= activeClip.end) {
                    processedTime += (activeClip ? (activeClip.end - activeClip.start) : 0);
                    currentClipIdx++;

                    if (currentClipIdx >= state.clips.length) {
                        clearInterval(exportInterval);
                        videoEl.pause();
                        mediaRecorder.stop();
                        return;
                    }
                    // 다음 클립의 시작 지점으로 Jump
                    videoEl.currentTime = state.clips[currentClipIdx].start;
                }

                videoEl.currentTime += 0.033;
                renderCanvasFrame();

                const currentProgress = processedTime + (videoEl.currentTime - state.clips[currentClipIdx].start);
                const pct = Math.min(100, Math.floor((currentProgress / totalDuration) * 100));
                progressBar.style.width = `${pct}%`;
                percentText.textContent = `${pct}%`;
            }, 33);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
    </script>
</body>
</html>
